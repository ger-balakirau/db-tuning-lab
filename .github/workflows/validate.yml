name: validate

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: make lint
      - name: Validate repository structure
        run: make test

  runtime-smoke:
    needs: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Show Docker versions
        run: |
          docker version
          docker compose version
      - name: Validate current database baselines
        run: make validate-current PROFILE=1gb
